<h2 mat-dialog-title>New Game</h2>

<div mat-dialog-content>
    <p>
        The current game is not finished yet.<br/>
        This action cannot be undone.<br/>
    </p>
    <p>
        Are you sure?
    </p>
</div>

<mat-dialog-actions align="end" class="action-buttons">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-button color="primary" [mat-dialog-close]="1">Yes, start new game</button>
</mat-dialog-actions>
