<mat-card class="mat-elevation-z4">
    <mat-card-title class="title">Codenames</mat-card-title>
    <mat-card-subtitle>Game created</mat-card-subtitle>

    <mat-card-content>
        <p>
            Join as:
        </p>

        <div class="team-role">
            <button mat-raised-button
                color="warn"
                (click)="onJoinAsCaptainClick()">

                Spymaster
            </button>

            <p>
                Spymasters see the team colour of all <span class="b">agents</span> on the board.
                They give short <span class="b">clues</span> to help their teammates
                identify <span class="b">their agents</span>.
            </p>
        </div>

        <div class="team-role">
            <button mat-raised-button
                color="primary"
                (click)="onJoinAsTeammateClick()">

                Operative
            </button>

            <p>
                Operatives only see the colour of already-uncovered agents. Together they
                try to decode the <span class="b">clues</span> and identify
                <span class="b">their agents</span>.
            </p>
        </div>
    </mat-card-content>

    <mat-card-actions align="end">
        <button mat-button (click)="onBackClick()">Back</button>
        <button mat-button (click)="onCopyLinkClick($event)">Game Link</button>
    </mat-card-actions>
</mat-card>
