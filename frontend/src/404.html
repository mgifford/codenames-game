<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Codenames</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // pathSegmentsToKeep is the number of path segments to keep in the redirect URL.
    // Set to 1 for a GitHub Pages project site (e.g. username.github.io/repo-name/).
    // Set to 0 for a root GitHub Pages site (e.g. username.github.io/).
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
